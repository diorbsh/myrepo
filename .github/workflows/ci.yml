name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Code aus dem Repo holen
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Java installieren (passt zum Docker-Image: Java 11)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      # 3. Gradle-Wrapper ausführbar machen
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 4. JAR bauen
      - name: Build with Gradle
        run: ./gradlew build

      # 5. Kontrolle: Wo liegt das JAR wirklich?
      - name: Show built files
        run: ls -l build/libs

      # 6. Docker-Image bauen
      - name: Build Docker Image
        run: docker build -t my-app .
